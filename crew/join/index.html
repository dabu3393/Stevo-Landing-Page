<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join a crew on Stevo</title>
  <style>
    :root { --bg:#0B0B0F; --card:#131318; --text:#F2F2F5; --muted:#9A9AA8; --green:#3DDC85; --line:#22222A; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .card { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:32px 28px; text-align:center; }
    .logo { width:64px; height:64px; border-radius:16px; margin-bottom:20px; }
    h1 { font-size:24px; font-weight:800; margin:0 0 8px; }
    p { color:var(--muted); font-size:15px; line-height:22px; margin:0 0 20px; }
    .code { background:rgba(61,220,133,0.10); border:1px solid rgba(61,220,133,0.35); border-radius:12px; padding:14px; margin:0 0 20px; font-size:15px; color:var(--muted); }
    .code strong { color:var(--green); font-size:20px; letter-spacing:2px; display:block; margin-top:4px; }
    .btn { display:block; background:var(--green); color:#0B0B0F; font-size:16px; font-weight:700; text-decoration:none; padding:15px; border-radius:12px; margin-bottom:12px; }
    .btn-secondary { display:block; color:var(--muted); font-size:14px; font-weight:600; text-decoration:none; padding:10px; }
    .hint { font-size:13px; color:#6A6A78; line-height:19px; margin:16px 0 0; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/stevo-logo.png" alt="Stevo" />
    <h1>You're invited to a crew on Stevo</h1>
    <p>Bet, play poker &amp; golf, and settle up with your crew.</p>
    <div class="code" id="codeBox" style="display:none">Invite code<strong id="code"></strong></div>
    <a class="btn" href="https://testflight.apple.com/join/RpchYrJc">Get Stevo</a>
    <a class="btn-secondary" id="openApp" href="#" style="display:none">Already have Stevo? Open it</a>
    <p class="hint">New here? Install Stevo, then <strong>tap this invite link again</strong> to join — or enter the code above under "Join with a code" in the app.</p>
  </div>
  <script>
    var code = new URLSearchParams(location.search).get('code');
    if (code) {
      document.getElementById('code').textContent = code;
      document.getElementById('codeBox').style.display = 'block';
      var open = document.getElementById('openApp');
      open.href = 'stevo://crew/join?code=' + encodeURIComponent(code);
      open.style.display = 'block';
    }
  </script>
</body>
</html>
